openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: relay
    description: Helius Telegram relay operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /relay/status:
    get:
      operationId: getRelayStatus
      tags: [relay]
      summary: Get relay status
      description: Returns Telegram configuration and the latest delivery state.
      responses:
        "200":
          description: Relay status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayStatus"
  /relay/events:
    get:
      operationId: getRelayEvents
      tags: [relay]
      summary: List recent relay events
      description: Returns the most recent Helius webhook deliveries held by this server.
      responses:
        "200":
          description: Recent relay events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelayEvent"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RelayStatus:
      type: object
      properties:
        configured:
          type: boolean
        tokenConfigured:
          type: boolean
        chatIdConfigured:
          type: boolean
        endpointPath:
          type: string
        recentEventCount:
          type: number
        lastDeliveryAt:
          type: ["string", "null"]
        lastDeliveryStatus:
          type: ["string", "null"]
          enum: [delivered, failed, null]
        lastDeliveryError:
          type: ["string", "null"]
      required:
        - configured
        - tokenConfigured
        - chatIdConfigured
        - endpointPath
        - recentEventCount
        - lastDeliveryAt
        - lastDeliveryStatus
        - lastDeliveryError
    RelayEvent:
      type: object
      properties:
        id:
          type: string
        receivedAt:
          type: string
        eventType:
          type: string
        summary:
          type: string
        signature:
          type: ["string", "null"]
        status:
          type: string
          enum: [delivered, failed]
        error:
          type: ["string", "null"]
      required:
        - id
        - receivedAt
        - eventType
        - summary
        - signature
        - status
        - error

